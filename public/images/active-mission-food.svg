<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none">
  <defs>
    <linearGradient id="foodBg" x1="0" y1="0" x2="600" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1A2E35"/>
    </linearGradient>
    <linearGradient id="warmCurry" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="0.7" stop-color="#D97706"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="riceWhite" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="steelPot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E2E8F0"/>
      <stop offset="0.4" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="containerGold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <filter id="steamGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="240" rx="16" fill="url(#foodBg)"/>
  <rect x="1" y="1" width="598" height="238" rx="15" stroke="rgba(6,182,212,0.25)" stroke-width="1.5"/>

  <!-- Background Ambient Glows -->
  <circle cx="210" cy="120" r="95" fill="#F59E0B" fill-opacity="0.12" filter="url(#steamGlow)"/>
  <circle cx="410" cy="120" r="90" fill="#10B981" fill-opacity="0.1" filter="url(#steamGlow)"/>

  <!-- Left: Stainless Steel Handi / Pot with Dal Sambar -->
  <g transform="translate(130, 45)">
    <!-- Base Plate Shadow -->
    <ellipse cx="80" cy="155" rx="75" ry="14" fill="#000000" fill-opacity="0.4"/>
    
    <!-- Outer Pot Body -->
    <path d="M 25 80 C 25 140, 135 140, 135 80 Z" fill="url(#steelPot)"/>
    <ellipse cx="80" cy="80" rx="55" ry="18" fill="#475569"/>
    
    <!-- Pot Rim -->
    <ellipse cx="80" cy="78" rx="58" ry="16" fill="none" stroke="#CBD5E1" stroke-width="3"/>
    
    <!-- Rich Golden Dal Sambar Inside Pot -->
    <ellipse cx="80" cy="82" rx="50" ry="14" fill="url(#warmCurry)"/>
    
    <!-- Spices & Garnishing on Dal -->
    <circle cx="68" cy="81" r="3" fill="#DC2626"/>
    <circle cx="92" cy="84" r="2.5" fill="#16A34A"/>
    <circle cx="78" cy="86" r="2" fill="#78350F"/>
    <circle cx="85" cy="79" r="3" fill="#15803D"/>
    <!-- Curry Leaf -->
    <path d="M 75 80 C 85 75, 90 82, 88 84 C 80 84, 76 83, 75 80 Z" fill="#16A34A"/>

    <!-- Handles -->
    <path d="M 22 85 C 10 85, 10 100, 22 100" stroke="#CBD5E1" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M 138 85 C 150 85, 150 100, 138 100" stroke="#CBD5E1" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Gentle Rising Steam -->
    <path d="M 65 65 Q 60 45, 70 30" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#steamGlow)"/>
    <path d="M 80 62 Q 85 40, 78 20" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#steamGlow)"/>
    <path d="M 95 65 Q 100 45, 90 30" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#steamGlow)"/>

    <text x="80" y="180" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="11" fill="#FBBF24" text-anchor="middle">Dal Sambar (Hot &amp; Fresh)</text>
  </g>

  <!-- Right: Large Bowl of Aromatic Steamed Basmati Rice -->
  <g transform="translate(320, 50)">
    <!-- Base Plate Shadow -->
    <ellipse cx="85" cy="150" rx="80" ry="14" fill="#000000" fill-opacity="0.4"/>
    
    <!-- Bowl Body -->
    <path d="M 20 85 C 20 145, 150 145, 150 85 Z" fill="url(#steelPot)"/>
    <ellipse cx="85" cy="85" rx="65" ry="18" fill="#334155"/>
    
    <!-- Mound of Fluffy White Steamed Rice -->
    <ellipse cx="85" cy="80" rx="62" ry="18" fill="url(#riceWhite)"/>
    <path d="M 28 80 C 40 55, 130 55, 142 80 Z" fill="url(#riceWhite)"/>
    
    <!-- Rice Texture Grains -->
    <ellipse cx="85" cy="68" rx="45" ry="12" fill="#F8FAFC"/>
    <circle cx="70" cy="65" r="2" fill="#CBD5E1"/>
    <circle cx="85" cy="62" r="2" fill="#CBD5E1"/>
    <circle cx="100" cy="66" r="2" fill="#CBD5E1"/>
    <circle cx="60" cy="72" r="2" fill="#CBD5E1"/>
    <circle cx="110" cy="71" r="2" fill="#CBD5E1"/>
    
    <!-- Fresh Coriander Garnish on Rice -->
    <path d="M 85 58 C 88 50, 95 53, 90 60 C 86 58, 84 57, 85 58 Z" fill="#22C55E"/>
    <circle cx="84" cy="59" r="1.5" fill="#15803D"/>

    <!-- Bowl Rim -->
    <ellipse cx="85" cy="84" rx="65" ry="17" fill="none" stroke="#E2E8F0" stroke-width="2.5"/>

    <!-- Rising Steam from Rice -->
    <path d="M 72 50 Q 68 32, 76 15" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#steamGlow)"/>
    <path d="M 90 48 Q 96 30, 88 12" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#steamGlow)"/>

    <text x="85" y="175" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="11" fill="#F8FAFC" text-anchor="middle">Steamed Basmati Rice</text>
  </g>

  <!-- Top Floating Header Badge -->
  <g transform="translate(25, 18)">
    <rect width="240" height="28" rx="14" fill="rgba(16,185,129,0.18)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#10B981"/>
    <text x="26" y="18" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="11" fill="#34D399">HOT FOOD RESCUE IN PROGRESS</text>
  </g>

  <g transform="translate(385, 18)">
    <rect width="190" height="28" rx="14" fill="rgba(6,182,212,0.18)" stroke="rgba(6,182,212,0.4)" stroke-width="1"/>
    <text x="12" y="18" font-size="12">📦</text>
    <text x="28" y="18" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="10.5" fill="#38BDF8">Insulated Container Sealed</text>
  </g>
</svg>
