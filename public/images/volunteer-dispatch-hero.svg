<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="640" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0E3A45"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberWarm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="280" rx="20" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="638" height="278" rx="19" stroke="rgba(6,182,212,0.25)" stroke-width="1.5"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="140" r="90" fill="#06B6D4" fill-opacity="0.12" filter="url(#glowEffect)"/>
  <circle cx="520" cy="80" r="110" fill="#10B981" fill-opacity="0.1" filter="url(#glowEffect)"/>

  <!-- Route Line Grid Lines -->
  <path d="M40 230 C 180 230, 240 180, 360 190 C 460 200, 520 150, 600 150" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6 6" stroke-opacity="0.6"/>

  <!-- Left: Donor Hotel Hub Badge -->
  <g transform="translate(45, 120)">
    <rect width="110" height="96" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="12" y="14" width="86" height="42" rx="8" fill="rgba(245,158,11,0.15)"/>
    <text x="55" y="42" font-size="24" text-anchor="middle">🏨</text>
    <text x="55" y="74" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="11" fill="#F8FAFC" text-anchor="middle">Donor Hotel</text>
    <text x="55" y="88" font-family="'Plus Jakarta Sans',sans-serif" font-weight="600" font-size="9" fill="#94A3B8" text-anchor="middle">Hot Fresh Food</text>
    <circle cx="55" cy="10" r="14" fill="url(#amberWarm)"/>
    <text x="55" y="14" font-size="11" text-anchor="middle" fill="#FFFFFF">📍</text>
  </g>

  <!-- Center: Volunteer Eco-Rider on Scooter with Insulated Cargo Box -->
  <g transform="translate(230, 75)">
    <!-- Scooter Body -->
    <ellipse cx="90" cy="130" rx="24" ry="24" fill="#0F172A" stroke="#06B6D4" stroke-width="3.5"/>
    <circle cx="90" cy="130" r="8" fill="#38BDF8"/>
    <ellipse cx="20" cy="130" rx="24" ry="24" fill="#0F172A" stroke="#06B6D4" stroke-width="3.5"/>
    <circle cx="20" cy="130" r="8" fill="#38BDF8"/>
    <path d="M20 130 L 55 125 L 80 95 L 90 130" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 125 L 45 80 L 35 60" stroke="#06B6D4" stroke-width="4" stroke-linecap="round"/>
    <!-- Handlebar -->
    <path d="M28 60 L 45 60" stroke="#F8FAFC" stroke-width="4" stroke-linecap="round"/>

    <!-- Insulated Food Cargo Container on Back -->
    <rect x="62" y="55" width="46" height="42" rx="7" fill="url(#emeraldAccent)" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="85" y="82" font-size="18" text-anchor="middle">🍱</text>
    <rect x="67" y="90" width="36" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.8"/>

    <!-- Volunteer Hero Rider Character -->
    <!-- Torso / Jacket -->
    <path d="M42 65 C 42 55, 62 55, 62 65 L 60 95 L 44 95 Z" fill="#0284C7"/>
    <!-- Safety Vest Stripes -->
    <rect x="46" y="74" width="12" height="4" fill="#FDE047"/>
    <rect x="46" y="82" width="12" height="4" fill="#FDE047"/>
    <!-- Helmet & Head -->
    <circle cx="52" cy="42" r="14" fill="#10B981" stroke="#ECFDF5" stroke-width="2"/>
    <path d="M48 42 h 12" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <!-- Motion Swoosh -->
    <path d="M-15 110 C 5 110, 10 115, 25 115" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
    <path d="M-25 125 C -5 125, 0 128, 15 128" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
  </g>

  <!-- Right: Receiving Shelter Hub Badge -->
  <g transform="translate(485, 95)">
    <rect width="115" height="106" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <rect x="12" y="14" width="91" height="46" rx="8" fill="rgba(16,185,129,0.15)"/>
    <text x="57" y="44" font-size="26" text-anchor="middle">🏢</text>
    <text x="57" y="78" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="11" fill="#F8FAFC" text-anchor="middle">NGO Shelter</text>
    <text x="57" y="94" font-family="'Plus Jakarta Sans',sans-serif" font-weight="600" font-size="9" fill="#34D399" text-anchor="middle">Confirmed Meals</text>
    <circle cx="57" cy="10" r="14" fill="url(#emeraldAccent)"/>
    <text x="57" y="14" font-size="11" text-anchor="middle" fill="#FFFFFF">✓</text>
  </g>

  <!-- Top Hero Header Ribbon -->
  <g transform="translate(30, 22)">
    <rect width="270" height="34" rx="17" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.4)" stroke-width="1"/>
    <text x="16" y="22" font-size="15">🚴</text>
    <text x="38" y="21" font-family="'Plus Jakarta Sans',sans-serif" font-weight="800" font-size="12" fill="#38BDF8">VOLUNTEERS FOOD RESCUE FLEET</text>
    <circle cx="248" cy="17" r="4" fill="#10B981"/>
  </g>

  <!-- Floating Feature Badges -->
  <g transform="translate(320, 22)">
    <rect width="145" height="28" rx="14" fill="rgba(16,185,129,0.18)" stroke="rgba(16,185,129,0.35)" stroke-width="1"/>
    <text x="12" y="18" font-size="12">🛡️</text>
    <text x="28" y="18" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="10.5" fill="#34D399">Food Quality Tested</text>
  </g>

  <g transform="translate(475, 22)">
    <rect width="135" height="28" rx="14" fill="rgba(245,158,11,0.18)" stroke="rgba(245,158,11,0.35)" stroke-width="1"/>
    <text x="12" y="18" font-size="12">🔒</text>
    <text x="28" y="18" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="10.5" fill="#FBBF24">2-Stage OTP Safe</text>
  </g>

  <!-- Bottom Interactive Status Bar -->
  <g transform="translate(30, 232)">
    <rect width="580" height="34" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(51,65,85,0.7)" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="#10B981"/>
    <text x="34" y="21" font-family="'Plus Jakarta Sans',sans-serif" font-weight="600" font-size="11.5" fill="#CBD5E1">Active Dispatch Radar · Fast Community Handover to Verified Shelters Across Mangaluru</text>
    <text x="560" y="21" font-family="'Plus Jakarta Sans',sans-serif" font-weight="700" font-size="11.5" fill="#38BDF8" text-anchor="end">FoodBridge AI ➔</text>
  </g>
</svg>
