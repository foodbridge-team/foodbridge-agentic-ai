<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <rect width="160" height="120" rx="12" fill="#F8FAFC"/>
  <!-- Green Banana Leaf Base -->
  <path d="M 12 70 C 12 35, 148 35, 148 70 C 148 105, 12 105, 12 70 Z" fill="#15803D"/>
  <path d="M 16 68 C 16 38, 144 38, 144 68 C 144 98, 16 98, 16 68 Z" fill="#16A34A"/>
  <line x1="20" y1="68" x2="140" y2="68" stroke="#14532D" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Crispy Golden Rolled Dosa -->
  <path d="M 30 74 C 40 50, 115 50, 130 74 C 115 84, 40 84, 30 74 Z" fill="#D97706"/>
  <path d="M 32 72 C 42 52, 113 52, 128 72 C 113 81, 42 81, 32 72 Z" fill="#F59E0B"/>
  <path d="M 40 70 C 50 56, 105 56, 120 70 C 105 77, 50 77, 40 70 Z" fill="#FBBF24"/>
  <!-- Brown Toast Marks on Dosa -->
  <ellipse cx="60" cy="67" rx="8" ry="3" fill="#B45309" fill-opacity="0.6"/>
  <ellipse cx="90" cy="65" rx="12" ry="4" fill="#B45309" fill-opacity="0.6"/>

  <!-- 3 Small Chutney / Sambar Katoris at Top -->
  <!-- 1. White Coconut Chutney -->
  <circle cx="50" cy="40" r="11" fill="#64748B"/>
  <circle cx="50" cy="39" r="9.5" fill="#F8FAFC"/>
  <circle cx="49" cy="38" r="1.5" fill="#15803D"/>
  <circle cx="52" cy="41" r="1" fill="#000000"/>

  <!-- 2. Red Tomato Chutney -->
  <circle cx="80" cy="38" r="11" fill="#64748B"/>
  <circle cx="80" cy="37" r="9.5" fill="#DC2626"/>
  <circle cx="79" cy="36" r="1.5" fill="#991B1B"/>
  <circle cx="82" cy="39" r="1" fill="#000000"/>

  <!-- 3. Sambar Katori -->
  <circle cx="110" cy="40" r="11" fill="#64748B"/>
  <circle cx="110" cy="39" r="9.5" fill="#D97706"/>
  <circle cx="110" cy="39" r="7.5" fill="#F59E0B"/>
  <circle cx="109" cy="38" r="1.5" fill="#16A34A"/>
</svg>
