<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">FoodBridge AI — Judge Presentation Diagram</title>
  <desc id="desc">A visual overview of FoodBridge AI users, application services, verification, food matching, delivery or NGO self-pickup, and confirmed handover.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8ef"/>
      <stop offset="1" stop-color="#eef5e9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#285c43"/>
      <stop offset="1" stop-color="#17422f"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#173b2b" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 11 6 1 11" fill="none" stroke="#5b8068" stroke-width="2"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #20372d; }
      .muted { fill: #62736a; }
      .small { font-size: 16px; }
      .body { font-size: 18px; }
      .card { fill: #fffefa; stroke: #dbe6d9; stroke-width: 2; }
      .line { stroke: #8ba592; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .step { fill: #fffefa; stroke: #dce8da; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1100" rx="0" fill="url(#bg)"/>
  <circle cx="1480" cy="115" r="150" fill="#f3dcc5" opacity=".35"/>
  <circle cx="95" cy="1020" r="180" fill="#cfe2ce" opacity=".30"/>

  <text x="800" y="64" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="3" fill="#d27443">FOOD RESCUE • TRUST • COMMUNITY</text>
  <text x="800" y="118" text-anchor="middle" font-size="42" font-weight="750">FoodBridge AI</text>
  <text x="800" y="153" text-anchor="middle" font-size="21" class="muted">Good Food Deserves a Second Chance.</text>
  <text x="800" y="188" text-anchor="middle" font-size="17" class="muted">A verified path from surplus food to people who need it</text>

  <!-- People and organizations -->
  <g filter="url(#shadow)">
    <rect class="card" x="80" y="225" width="320" height="120" rx="20"/>
    <rect class="card" x="465" y="225" width="320" height="120" rx="20"/>
    <rect class="card" x="850" y="225" width="320" height="120" rx="20"/>
    <rect class="card" x="1235" y="225" width="285" height="120" rx="20"/>
  </g>
  <text x="112" y="269" font-size="31">🍲</text>
  <text x="160" y="269" font-size="21" font-weight="700">Food Donor</text>
  <text x="112" y="305" class="small muted">Restaurants • caterers • communities</text>
  <text x="497" y="269" font-size="31">🤝</text>
  <text x="545" y="269" font-size="21" font-weight="700">NGO / Shelter</text>
  <text x="497" y="305" class="small muted">Verified organizations • food recipients</text>
  <text x="882" y="269" font-size="31">🚴</text>
  <text x="930" y="269" font-size="21" font-weight="700">Delivery Partner</text>
  <text x="882" y="305" class="small muted">Verified and availability-aware</text>
  <text x="1267" y="269" font-size="31">🛡️</text>
  <text x="1315" y="269" font-size="21" font-weight="700">Admin</text>
  <text x="1267" y="305" class="small muted">Reviews verification requests</text>

  <path class="line" d="M240 345 V388"/>
  <path class="line" d="M625 345 V388"/>
  <path class="line" d="M1010 345 V388"/>
  <path class="line" d="M1375 345 V388"/>

  <!-- Application core -->
  <rect x="80" y="400" width="1440" height="180" rx="26" fill="url(#green)" filter="url(#shadow)"/>
  <text x="800" y="443" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">FOODBRIDGE AI PLATFORM</text>
  <text x="800" y="470" text-anchor="middle" font-size="15" fill="#dceade">Role-based web portals • Node.js API • server-side authorization</text>
  <g>
    <rect x="112" y="493" width="320" height="58" rx="14" fill="#ffffff" opacity=".13" stroke="#ffffff" stroke-opacity=".35"/>
    <rect x="464" y="493" width="320" height="58" rx="14" fill="#ffffff" opacity=".13" stroke="#ffffff" stroke-opacity=".35"/>
    <rect x="816" y="493" width="320" height="58" rx="14" fill="#ffffff" opacity=".13" stroke="#ffffff" stroke-opacity=".35"/>
    <rect x="1168" y="493" width="320" height="58" rx="14" fill="#ffffff" opacity=".13" stroke="#ffffff" stroke-opacity=".35"/>
  </g>
  <text x="272" y="529" text-anchor="middle" font-size="17" font-weight="650" fill="#ffffff">Account verification &amp; access control</text>
  <text x="624" y="529" text-anchor="middle" font-size="17" font-weight="650" fill="#ffffff">Safety checks &amp; explainable matching</text>
  <text x="976" y="529" text-anchor="middle" font-size="17" font-weight="650" fill="#ffffff">Reservation &amp; delivery coordination</text>
  <text x="1328" y="529" text-anchor="middle" font-size="17" font-weight="650" fill="#ffffff">OTP handover &amp; audit trail</text>

  <path class="line" d="M800 580 V620"/>
  <text x="800" y="650" text-anchor="middle" font-size="24" font-weight="700">THE RESCUE JOURNEY</text>

  <!-- Journey steps -->
  <g filter="url(#shadow)">
    <rect class="step" x="64" y="680" width="260" height="172" rx="20"/>
    <rect class="step" x="374" y="680" width="260" height="172" rx="20"/>
    <rect class="step" x="684" y="680" width="260" height="172" rx="20"/>
    <rect class="step" x="994" y="680" width="260" height="172" rx="20"/>
    <rect class="step" x="1304" y="680" width="232" height="172" rx="20"/>
  </g>
  <path class="line" d="M324 766 H362"/>
  <path class="line" d="M634 766 H672"/>
  <path class="line" d="M944 766 H982"/>
  <path class="line" d="M1254 766 H1292"/>

  <circle cx="99" cy="716" r="18" fill="#e9f1e5"/><text x="99" y="722" text-anchor="middle" font-size="17" font-weight="700">1</text>
  <text x="92" y="758" font-size="20" font-weight="700">Verify people</text>
  <text x="92" y="791" class="small muted">Admin approves donors,</text><text x="92" y="815" class="small muted">NGOs and delivery partners.</text>

  <circle cx="409" cy="716" r="18" fill="#e9f1e5"/><text x="409" y="722" text-anchor="middle" font-size="17" font-weight="700">2</text>
  <text x="402" y="758" font-size="20" font-weight="700">List surplus food</text>
  <text x="402" y="791" class="small muted">Donor adds quantity, type,</text><text x="402" y="815" class="small muted">allergens and freshness.</text>

  <circle cx="719" cy="716" r="18" fill="#e9f1e5"/><text x="719" y="722" text-anchor="middle" font-size="17" font-weight="700">3</text>
  <text x="712" y="758" font-size="20" font-weight="700">Match responsibly</text>
  <text x="712" y="791" class="small muted">Checks safety, capacity,</text><text x="712" y="815" class="small muted">distance and time window.</text>

  <circle cx="1029" cy="716" r="18" fill="#e9f1e5"/><text x="1029" y="722" text-anchor="middle" font-size="17" font-weight="700">4</text>
  <text x="1022" y="758" font-size="20" font-weight="700">Choose collection</text>
  <text x="1022" y="791" class="small muted">Verified courier, or NGO</text><text x="1022" y="815" class="small muted">self-pickup if unavailable.</text>

  <circle cx="1339" cy="716" r="18" fill="#e9f1e5"/><text x="1339" y="722" text-anchor="middle" font-size="17" font-weight="700">5</text>
  <text x="1332" y="758" font-size="20" font-weight="700">Confirm handover</text>
  <text x="1332" y="791" class="small muted">Pickup + receipt OTP,</text><text x="1332" y="815" class="small muted">photo proof and audit.</text>

  <!-- Outcome and credibility strip -->
  <rect x="80" y="890" width="1440" height="125" rx="22" fill="#f6eadb" stroke="#ebd6be" stroke-width="2"/>
  <text x="125" y="934" font-size="20" font-weight="700" fill="#a65832">THE RESULT</text>
  <text x="125" y="968" font-size="18">Safer food recovery • accountable pickup • confirmed delivery • less avoidable waste</text>
  <line x1="800" y1="914" x2="800" y2="991" stroke="#ddc6ab" stroke-width="2"/>
  <text x="845" y="934" font-size="18" font-weight="700">Built on real project data</text>
  <text x="845" y="963" class="small muted">Rule-based matching with reasons; no external LLM.</text>
  <text x="845" y="988" class="small muted">Current demo stores runtime records in memory.</text>

  <text x="800" y="1058" text-anchor="middle" font-size="15" class="muted">FoodBridge AI  •  Good Food Deserves a Second Chance.</text>
</svg>
